<text x="176" y="45" text-anchor="middle" font-size="36" font-weight="900" fill="#e8483a" font-family="Arial, sans-serif">4</text>
</g>
<!-- 大字 -->
<g font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-weight="900" text-anchor="middle">
<text x="390" y="262" font-size="150" fill="#b8551f" stroke="#3a3540" stroke-width="22" stroke-linejoin="round" transform="rotate(-5 390 220)">弹里个弹</text>
<text x="384" y="252" font-size="150" fill="#fff1d6" stroke="#3a3540" stroke-width="10" stroke-linejoin="round" paint-order="stroke" transform="rotate(-5 390 220)">弹里个弹</text>
<g transform="rotate(-5 390 220)"><rect x="216" y="282" width="336" height="54" rx="27" fill="#3a7fd0" stroke="#3a3540" stroke-width="5"/>
<text x="384" y="320" font-size="32" fill="#fff">萌宠厨房大乱斗</text></g>
