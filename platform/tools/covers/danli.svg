<!-- 纸飞机 -->
<g transform="translate(560 420) rotate(-16)">
<path d="M0 0l70-26-24 50-12-16z" fill="#fffdf6" stroke="#3a3540" stroke-width="4" stroke-linejoin="round"/>
<path d="M34 8l36-34" stroke="#3a3540" stroke-width="3"/>
