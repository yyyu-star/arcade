<path d="M30 14v40" stroke="#3a3540" stroke-width="5" stroke-linecap="round"/>
<path d="M32 16h52l-8 12 8 12h-52z" fill="#e8483a" stroke="#3a3540" stroke-width="3.5" stroke-linejoin="round"/>
