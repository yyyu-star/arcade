<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
<!-- 弹里个弹的大厅封面（平台 0.26.4）：平台手写，照游戏的画风（绘本纸、厨房瓷砖、面团地形、萌宠、包子蒸笼和锅盖），没有外部素材。
     改图后在 platform 目录跑 npm run cover，参数 from=tools/covers/danli.svg、id=danli（见 ASSETS.md） -->
<defs>
<pattern id="tile" width="120" height="120" patternUnits="userSpaceOnUse"><rect width="120" height="120" fill="#f7efdd"/><path d="M0 0H120M0 0V120" stroke="#e6dac0" stroke-width="3"/></pattern>
<pattern id="crumb" width="46" height="34" patternUnits="userSpaceOnUse"><circle cx="10" cy="9" r="3" fill="#e9b877"/><circle cx="31" cy="24" r="2.5" fill="#e9b877"/><circle cx="40" cy="6" r="1.8" fill="#e9b877"/></pattern>
<linearGradient id="dough" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbd9a2"/><stop offset="1" stop-color="#f3c07e"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3f6"/><stop offset="1" stop-color="#e3f3fb"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#5a3a1a" flood-opacity=".22"/></filter>
</defs>
<rect width="1280" height="720" fill="url(#tile)"/>
<!-- 窗户和挂钩，跟游戏的远景一样淡 -->
<g opacity=".75">
<rect x="860" y="120" width="330" height="200" rx="10" fill="url(#sky)" stroke="#d9cdb3" stroke-width="6"/>
<path d="M1025 120V320" stroke="#d9cdb3" stroke-width="6"/>
<path d="M905 190c10-18 40-18 50 0c16-2 24 14 12 22h-70c-12-6-6-22 8-22z" fill="#fff"/>
<path d="M1080 250c8-14 32-14 40 0c13-1 19 11 9 17h-56c-10-5-5-17 7-17z" fill="#fff"/>
<path d="M300 0V60M270 60H330" stroke="#cfc2a6" stroke-width="5" stroke-linecap="round"/>
<ellipse cx="300" cy="92" rx="14" ry="28" fill="none" stroke="#cfc2a6" stroke-width="5"/>
</g>
<!-- 纸边外的书桌 -->
<path d="M0 0H44l-6 40 8 30-7 50 9 40-8 60 7 50-6 70 8 60-7 70 9 60-8 90 6 60-4 40H0z" fill="#3a3540"/>
