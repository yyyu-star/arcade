<path d="M-10 4c4 6 16 6 20 0" fill="none" stroke="#3a3540" stroke-width="4" stroke-linecap="round"/>
<ellipse cx="-38" cy="-4" rx="9" ry="5" fill="#ff9d8a" opacity=".7"/><ellipse cx="38" cy="-4" rx="9" ry="5" fill="#ff9d8a" opacity=".7"/>
</g>
