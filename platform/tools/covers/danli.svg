<g filter="url(#sh)" stroke="#3a3540" stroke-width="7" stroke-linejoin="round">
<path d="M90 560c40-14 90-6 140-14c60-10 90-2 130-8l14 28c50-6 80-40 120-50c40-10 70 18 110 10l20 40c-20 50-80 70-160 76c-90 6-180 0-260-10c-60-8-110-30-114-48z" fill="url(#dough)"/>
<path d="M770 610c30-40 70-80 120-84c40-4 60 20 110 14c60-8 100-34 160-28c40 4 70 30 80 58c-10 36-60 58-150 64c-110 8-230 6-320-24z" fill="url(#dough)"/>
<path d="M640 330c30-10 70-12 100-4c20 6 22 30 6 42c-30 18-80 18-104 2c-14-10-16-34-2-40z" fill="url(#dough)"/>
</g>
<g stroke="#ef9442" stroke-width="6" fill="none" stroke-linecap="round" opacity=".9">
