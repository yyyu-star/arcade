<path d="M-40 70c-6-40 10-66 40-66s46 26 40 66z" fill="#f57d2a" stroke="#3a3540" stroke-width="6" stroke-linejoin="round"/>
<path d="M-20 70c-2-20 6-34 20-34s22 14 20 34z" fill="#fff1d6"/>
<path d="M-36 28c20 10 52 10 72 0v12c-20 10-52 10-72 0z" fill="#3a7fd0" stroke="#3a3540" stroke-width="4"/>
