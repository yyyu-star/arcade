<path d="M-8-44c6 20 6 68 0 88" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" opacity=".9"/>
<rect x="-34" y="-12" width="14" height="24" rx="5" fill="#8a2f28" stroke="#3a3540" stroke-width="4"/>
</g>
<g transform="translate(0 -110)">
<rect x="-66" y="-22" width="132" height="40" rx="12" fill="#fffdf6" stroke="#3a3540" stroke-width="4"/>
<path d="M-46-14l5 10 11 1-8 7 3 11-11-6-10 6 3-11-8-7 11-1z" fill="#f5a531" stroke="#3a3540" stroke-width="2.5" stroke-linejoin="round"/>
<text x="10" y="8" text-anchor="middle" font-size="24" font-weight="900" fill="#3a3540" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif">橘子</text>
</g>
