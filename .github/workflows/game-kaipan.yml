# 开盘（games/kaipan/）：只在开盘或共用包有改动时测试、构建并部署到 Cloudflare Workers（kaipan，路径路由 /games/kaipan/）。
# PR 上只跑 test（不碰凭证）；deploy 只在 main 上跑，用 production 环境里的凭证（该环境只允许 main 部署），
# 并先用 tools/verify-main.sh 核对 main 的历史都是经 PR、由所有者合并的——直接推送的提交不部署（见仓库根 CONTRIBUTING.md）。
# 拆成独立仓库时：去掉 paths 和 working-directory，把 games/kaipan/ 前缀去掉即可。
name: Deploy kaipan
on:
  push:
    branches: [main]
    paths:
      - 'games/kaipan/**'
      - '.github/workflows/game-kaipan.yml'
  pull_request:
    paths:
      - 'games/kaipan/**'
      - '.github/workflows/game-kaipan.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: games/kaipan
jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      # PR 上新推送取消旧的检查
      group: game-kaipan-test-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: games/kaipan/.nvmrc
          cache: npm
          cache-dependency-path: games/kaipan/package-lock.json
      - run: node ../../tools/check-isolation.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build:cf
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      # 部署排队，不互相打断
      group: game-kaipan-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 只部署经 PR 合并、由所有者合并进 main 的历史
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: bash tools/verify-main.sh "${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version-file: games/kaipan/.nvmrc
          cache: npm
          cache-dependency-path: games/kaipan/package-lock.json
      - run: npm ci
      - run: npm run build:cf
      # 路由在部署时注入：正式站的主机名只放在 production 环境的 secret SITE_HOST 里（公开仓库的日志会自动打码），没设就失败，不带着空路由部署
      - name: 部署（注入 /games/kaipan 的路由）
        run: |
          : "${SITE_HOST:?SITE_HOST 未设置}"
          npx wrangler deploy --route "$SITE_HOST/games/kaipan" --route "$SITE_HOST/games/kaipan/*"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_HOST: ${{ secrets.SITE_HOST }}
