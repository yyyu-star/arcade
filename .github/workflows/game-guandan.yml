# 掼蛋（games/guandan/）：只在掼蛋或共用包有改动时测试、构建并部署到 Cloudflare Workers（guandan，路径路由 <站点>/games/guandan/）。
# 站点主机名只在 production 环境的 secret SITE_HOST 里（公开仓库的日志里 secret 会被打码），部署时注入路由和 SITE_ORIGIN；没设就失败。
# PR 上只跑 test（不碰凭证）；deploy 只在 main 上跑，用 production 环境里的凭证（该环境只允许 main 部署），
# 并先用 tools/verify-main.sh 核对 main 的历史都是经 PR、由仓库所有者合并的——直接推送的提交不部署（见仓库根 CONTRIBUTING.md）。
# 拆成独立仓库时：去掉 paths 和 working-directory，把 games/guandan/ 前缀去掉即可。
name: Deploy guandan
on:
  push:
    branches: [main]
    paths:
      - 'games/guandan/**'
      - 'packages/arcade-kit/**'
      - '.github/workflows/game-guandan.yml'
  pull_request:
    paths:
      - 'games/guandan/**'
      - 'packages/arcade-kit/**'
      - '.github/workflows/game-guandan.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: games/guandan
jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      # PR 上新推送取消旧的检查
      group: game-guandan-test-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: games/guandan/.nvmrc
          cache: npm
          cache-dependency-path: games/guandan/package-lock.json
      - run: node ../../tools/check-isolation.mjs
      - run: npm ci
      - run: npm test
      - run: npm run test:room --if-present
      - run: npm run build:cf
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      # 部署排队，不互相打断
      group: game-guandan-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 只部署经 PR 合并、由仓库所有者合并进 main 的历史
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: bash tools/verify-main.sh "${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version-file: games/guandan/.nvmrc
          cache: npm
          cache-dependency-path: games/guandan/package-lock.json
      - run: npm ci
      - run: npm run build:cf
      - name: 部署（路由和 SITE_ORIGIN 由 SITE_HOST 注入）
        run: |
          : "${SITE_HOST:?SITE_HOST 未设置}"
          npx wrangler deploy --route "$SITE_HOST/games/guandan" --route "$SITE_HOST/games/guandan/*" --var "SITE_ORIGIN:https://$SITE_HOST"
        env:
          SITE_HOST: ${{ secrets.SITE_HOST }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
