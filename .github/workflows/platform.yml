# 平台（platform/）：只在平台有改动时测试、构建并部署（平台不依赖共用包）到 Cloudflare Workers（arcade，站点域名用 --domain 挂上）。
# 两个作业（为什么这样分见 docs/review-policy.md 的「部署怎么防」一节）：
#   test：测试、构建、打包、界面冒烟。跑的是合并进来的模块代码，所以拿不到任何凭证（不进 production 环境）；打出的产物当不可信数据交给 deploy。
#   deploy：只在 main 上、进 production 环境。不 checkout 模块代码（sparse-checkout 只取 tools/、platform/wrangler.jsonc 和 platform/migrations/）、
#     不装模块依赖，先用 tools/verify-main.sh 核对 main 的历史都是经 PR、由仓库所有者合并的，再由 tools/deployer/deploy.mjs 用钉死版本的
#     wrangler 重新检查产物和配置，填上正式库的 id，先迁移 D1、再部署（注入域名和 SITE_ORIGIN）。
# 正式站的域名和 D1 的 id 只在 production 环境的 secret 里（SITE_HOST、D1_DATABASE_ID），见 platform/README.md 的部署一节。
# 拆成独立仓库时：去掉 paths 和 working-directory，把 platform/ 前缀去掉，并把 tools/deployer、tools/verify-main.sh 一起带走。
name: Deploy platform
on:
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - '.github/workflows/platform.yml'
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/platform.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: platform
jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      # PR 上新推送取消旧的检查
      group: platform-test-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: platform/.nvmrc
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: node ../tools/check-isolation.mjs
      - run: npm ci
      # 接口测试在本地 workerd + 本地 D1 里跑（@cloudflare/vitest-plugin），不碰线上；没有 test 脚本的旧版本跳过
      - run: npm run test --if-present
      - run: npm run build
      # PR 上也打一次包（几秒钟），合并前就能发现打包的问题；只有 main 上才上传给 deploy。在冒烟之前打，打的是刚构建出来的 dist
      - name: 打包（wrangler --dry-run，产物交给 deploy 重新检查）
        run: |
          npx wrangler deploy --dry-run -c wrangler.jsonc --outdir "$RUNNER_TEMP/artifact/worker"
          node ../tools/deployer/pack.mjs "$RUNNER_TEMP/artifact"
      # 界面冒烟：本地临时 D1 + 假 Secret 起 wrangler dev，无头 Chromium 走主流程，控制台零报错（tools/smoke.ts）；不碰线上
      - name: 装无头 Chromium
        if: hashFiles('platform/tools/smoke.ts') != ''
        run: npx playwright-core install --with-deps --only-shell chromium
      - name: 界面冒烟
        if: hashFiles('platform/tools/smoke.ts') != ''
        run: npm run smoke
      - name: 冒烟失败时上传截图
        if: failure() && hashFiles('platform/tools/smoke.ts') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-smoke-shots
          path: platform/shots
          retention-days: 7
          if-no-files-found: ignore
      - name: 上传产物
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-bundle
          path: ${{ runner.temp }}/artifact
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: false
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      # 部署排队，不互相打断
      group: platform-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      # 只取维护者管的 tools/、平台审过的 wrangler.jsonc 和 D1 迁移（都只当数据读）；平台的代码、package.json、node_modules 一概不进这个作业
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /platform/wrangler.jsonc
            /platform/migrations/
      - name: 只部署经 PR 合并、由仓库所有者合并进 main 的历史
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: bash tools/verify-main.sh "${{ github.sha }}"
      # 只部署 main 上本模块的最新提交：排队或等批准期间又合并了新的 PR，而且改过本模块（或它的流程、tools/），这次运行的提交就旧了，部署它会把线上退回旧版本。
      # 别的模块、文档、共用包的合并不挡（2026-10-18 起各模块能同时发）。失败时不重跑这次运行：对 main 手动运行本流程（workflow_dispatch），部署的就是最新提交（见 CONTRIBUTING.md）
      - name: 只部署 main 上本模块的最新提交
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash tools/verify-latest.sh "${{ github.sha }}" platform/ .github/workflows/platform.yml tools/
      # 不用缓存：缓存能被跑模块代码的作业写
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: 装钉死版本的 wrangler（tools/deployer，不跑安装脚本）
        working-directory: tools/deployer
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: platform-bundle
          path: ${{ runner.temp }}/artifact
      # deploy.mjs：检查通过后生成带正式库 id 的最终配置（id 为空或不像 UUID 直接失败——没有 id 的 D1，wrangler 会自己新建一个空库），
      # 先 d1 migrations apply（新代码依赖新表；迁移只增不删，旧代码碰上新表结构照常运行），再 deploy --domain，SITE_ORIGIN 让 /api 只认这个域名。
      # 给 wrangler 的环境只有必需的几个变量，工作目录是新建的空目录，--env-file 指向 /dev/null（不读任何 .env）
      - name: 检查产物和配置，迁移 D1，部署（注入域名和 SITE_ORIGIN）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_BASE_URL: https://api.cloudflare.com/client/v4
          SITE_HOST: ${{ secrets.SITE_HOST }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: node tools/deployer/deploy.mjs --module platform --artifact "$RUNNER_TEMP/artifact" --work "$RUNNER_TEMP/deploy"
