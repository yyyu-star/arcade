# 雀馆麻将（games/mahjong/）：只在麻将或共用包有改动时测试、构建并部署到 Cloudflare Workers（mahjong，路径路由 /games/mahjong/）。
# PR 上只跑 test（不碰凭证）；deploy 只在 main 上跑，用 production 环境里的凭证（该环境只允许 main 部署），
# 并先用 tools/verify-main.sh 核对 main 的历史都是经 PR、由所有者合并的——直接推送的提交不部署（见仓库根 CONTRIBUTING.md）。
# 拆成独立仓库时：去掉 paths 和 working-directory，把 games/mahjong/ 前缀去掉即可。
name: Deploy mahjong
on:
  push:
    branches: [main]
    paths:
      - 'games/mahjong/**'
      - 'packages/arcade-kit/**'
      - '.github/workflows/game-mahjong.yml'
  pull_request:
    paths:
      - 'games/mahjong/**'
      - 'packages/arcade-kit/**'
      - '.github/workflows/game-mahjong.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: games/mahjong
jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      # PR 上新推送取消旧的检查
      group: game-mahjong-test-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: games/mahjong/.nvmrc
          cache: npm
          cache-dependency-path: games/mahjong/package-lock.json
      - run: node ../../tools/check-isolation.mjs
      - run: npm ci
      - run: npm test
      - run: npm run test:room --if-present
      - run: npm run build:cf --if-present
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      # 部署排队，不互相打断
      group: game-mahjong-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 只部署经 PR 合并、由所有者合并进 main 的历史
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: bash tools/verify-main.sh "${{ github.sha }}"
      # 模块还没有 wrangler.jsonc（设计、规则核心阶段）时不部署；hashFiles 只能用在步骤上
      - uses: actions/setup-node@v4
        if: hashFiles('games/mahjong/wrangler.jsonc') != ''
        with:
          node-version-file: games/mahjong/.nvmrc
          cache: npm
          cache-dependency-path: games/mahjong/package-lock.json
      - run: npm ci
        if: hashFiles('games/mahjong/wrangler.jsonc') != ''
      - run: npm run build:cf
        if: hashFiles('games/mahjong/wrangler.jsonc') != ''
      # 路由和 SITE_ORIGIN 不进仓库（wrangler.jsonc 里没有），正式站的主机名只在 production 环境的 secret SITE_HOST 里；没设就失败，不带着空路由部署
      - run: |
          : "${SITE_HOST:?SITE_HOST 未设置}"
          npx wrangler deploy --route "$SITE_HOST/games/mahjong" --route "$SITE_HOST/games/mahjong/*" --var "SITE_ORIGIN:https://$SITE_HOST"
        if: hashFiles('games/mahjong/wrangler.jsonc') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_HOST: ${{ secrets.SITE_HOST }}
